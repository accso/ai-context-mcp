# Machine-readable arm config for the "idea-mcp" arm of the retrieval
# benchmark (plan §6 — migrated from
# .github/skills/benchmark/references/benchmark-session-idea-mcp.md, which
# remains the authoritative human-readable protocol document; this file is
# the tool-allowlist/metadata subset of it made machine-checkable).
arm: idea-mcp
protocolDoc: .github/skills/benchmark/references/benchmark-session-idea-mcp.md
description: >
  Answer every query using only JetBrains/idea-mcp tools, nothing else.
allowedTools:
  - "search_symbol"          # declared-symbol lookup (classes, functions, etc.)
  - "search_text"            # full-text search, optional filePath
  - "search_regex"           # regex search, optional filePath
  - "search_file"            # locate a file by name
  - "list_directory_tree"    # directory/module structure
  - "get_project_modules"    # project module list
  - "get_project_dependencies" # dependency graph
  - "read_file"              # fetch file content by path
  - "get_file_text_by_path"  # fetch file content by path (alt tool name)
  - "analyze_calls"          # call-graph lookup, if available in environment
disallowedNote: >
  Any generic filesystem read/grep/glob tool outside the idea-mcp surface
  above, ai-context's own tools (repo_structure/semantic_search/get_file),
  web search, or any tool outside the allowlist invalidates that query's
  data point for this arm (see protocolDoc for the full rationale).
operatorMetadataFields:
  - targetRepository
  - dateTimeRun
  - totalFilesApprox
  - totalFoldersApprox
  - primaryLanguages
  - ideVersion
  - executingModel
