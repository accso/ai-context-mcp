# ─────────────────────────────────────────────────────────────────────────────
# AI CONTEXT CONFIG — multi-project schema
#
# Quick-start:
#   1. Adjust the `projects` list below — one entry per logical project/module.
#   2. Run:  mise run ai-context-up  (validates config automatically before starting)
#
# mcp.port must be set explicitly for every project — pick a free port and
# keep each project on a unique port on your machine.
# ─────────────────────────────────────────────────────────────────────────────


# ── Shared settings ───────────────────────────────────────────────────────────
# Applied to every project unless overridden at project level.
shared:

  # ── Embedding ────────────────────────────────────────────────────────────────
  # No config here anymore. Embeddings are generated by the shared, mandatory
  # "inference" service (.ai-context/inference/, FastEmbed/onnxruntime,
  # nomic-embed-text-v1.5) — always-on infra alongside Qdrant/Postgres, not a
  # user-managed external process like LM Studio/omlx. Hardcoded rather than
  # configurable because the model's vector dimension is baked into every
  # project's Qdrant collection schema at creation time — changing it is a
  # data-migration decision (`mise run ai-context-reset`), not a config toggle.
  # See docs/configuration.md and docs/architecture-deep-dive.md.

  # ── LLM (for L1 summary generation) ─────────────────────────────────────────
  llm:
    # Provider for L1 summary generation.
    # Options: lmstudio, ollama, omlx
    provider: "omlx"

    # Only relevant if provider is lmstudio.
    lmstudio_base_url: "http://host.docker.internal:1234/v1"

    # Only relevant if provider is omlx.
    # omlx is a local LLM runtime running at 127.0.0.1:8000 (same machine as Docker).
    # OMLX_API_KEY env var is only needed if your omlx instance has auth enabled.
    omlx_base_url: "http://host.docker.internal:8000/v1"

    # Model for generating 4–6 sentence file summaries (L1 cache).
    # The task is structured output at temperature 0.1 — any modern 4B+ code model works well.
    # There is no subagent/gateway anymore (removed — see README "Deprecated: LLM
    # Subagent Gateway (v1)"), so this model is sized purely for L1 summary quality —
    # no same-model constraint with another local-inference consumer.
    #
    # Model name — must match exactly what the provider serves.
    model: "Qwen2.5-Coder-3B-Instruct-MLX-4bit"

    # Only needed for true thinking/CoT models (deepseek-r1-*, qwen3-*-thinking-*).
    # gemma-4-12B-it is NOT a thinking model — no CoT overhead.
    disable_thinking: true

  # ── Indexer defaults ─────────────────────────────────────────────────────────
  indexer:
    # Debounce delay in seconds. File changes are batched after this many seconds
    # of inactivity on the changed file.
    debounce_seconds: 2

    # How often (in minutes) the watcher performs a full delta scan against the
    # database to catch any changes missed by live filesystem events
    # (e.g. a 'git pull' while the watcher is already running).
    # Set to 0 to disable periodic reconciliation (startup-only).
    reconcile_interval_minutes: 30

    # FALLBACK ONLY — polling-based file watching, running *alongside* (never
    # instead of) the primary native OS file-event watcher (inotify/FSEvents).
    #
    # Why this exists: native file-system events depend on your container
    # runtime correctly forwarding host filesystem changes into the container.
    # On some setups — notably Docker Desktop / Rancher Desktop on macOS with
    # certain bind-mount configurations — these events silently do not
    # propagate at all, even though nothing looks broken. Confirmed on this
    # project: switching Rancher Desktop to the `virtiofs` mount type
    # (Preferences → Virtual Machine → Volumes) is NECESSARY but was NOT
    # SUFFICIENT by itself — the underlying Lima `mountInotify` flag also has
    # to be enabled, and Rancher Desktop's settings UI doesn't yet expose a
    # way to turn that on reliably. If native events aren't working for you,
    # this is very likely why.
    #
    # This fallback runs a second, independent watchdog observer
    # (PollingObserver — periodic stat()-based change detection) at the
    # interval below, feeding into the exact same debounce/indexing pipeline
    # as the primary watcher. It is deliberately NOT a replacement for native
    # events — when native events work, this just does redundant (cheap)
    # polling in the background; when they don't, this is what actually keeps
    # the index current within `polling_fallback_seconds`, instead of waiting
    # up to `reconcile_interval_minutes` for the periodic reconciliation to
    # eventually catch it. A startup log warning always explains which mode is
    # active. Set to 0 to disable this fallback entirely.
    polling_fallback_seconds: 10

    # Maximum characters per chunk sent to the embedding model.
    # nomic-embed-text-v1.5 has a 2048-token context window.  At ~3–4 chars/token
    # for typical source code, 6 000 chars ≈ 1 500–2 000 tokens — safely below the
    # limit.  Chunks from large classes/functions that exceed this threshold are
    # automatically split at line boundaries before embedding.
    max_chunk_chars: 6000

    # Additional paths to skip, relative to each project's root_path. Use this
    # for anything that shouldn't be searchable or backed up — generated
    # artifacts, vendored/third-party code you don't want cluttering results,
    # or paths containing sensitive/unnecessary data. Excluding a path here
    # means it is never indexed, so it is also automatically never included
    # in `mise run ai-context-backup` output (backup mirrors whatever was
    # indexed 1:1 — there is no separate backup-time filter).
    #
    # The watcher always skips (hardcoded, every project, cannot be disabled):
    # build/, .gradle/, node_modules/, .ai-context/, .git/, dist/, out/,
    # target/, __pycache__/, .idea/, .vscode/, .kotlin/, generated/,
    # generated-sources/, *.class, *.jar, *.lock
    #
    # This project's own `backup_output_dir` (below) is ALSO always
    # auto-excluded for whichever project's root_path contains it — no config
    # needed for that specific case; it's handled automatically by
    # scripts/validate_config.py so a project never indexes its own backup
    # dumps as if they were source code.
    #
    # Per-project override: projects[].indexer.extra_skip_paths — this is
    # ADDITIVE to the list below, not a replacement (a project-specific
    # exclusion doesn't affect other projects). Example:
    #   projects:
    #     - name: my-project
    #       indexer:
    #         extra_skip_paths: ["secrets/", "fixtures/large-sample-data/"]
    extra_skip_paths: []

    # Additional .gitignore-format files to merge with each project's own
    # <root_path>/.gitignore (which is always read by default — this setting
    # only ADDS more files, it never disables reading the project's own
    # .gitignore). Paths are relative to the repo root (same convention as
    # backup_output_dir), and — unlike extra_skip_paths — do NOT need to be
    # inside the project's own root_path. This is the main reason to use this
    # instead of extra_skip_paths: a big monorepo often has one top-level
    # .gitignore that individual project subdirectories don't repeat, so this
    # lets a project pick that up without copying/duplicating entries.
    #
    # Merge semantics: patterns from every file (this project's own
    # .gitignore + all configured extra files) are combined into ONE set of
    # rules — a path is excluded if ANY of them would exclude it.
    #
    # Caveat: a leading-'/' pattern is normally anchored to the directory of
    # the .gitignore file it came from (standard git semantics). Once
    # merged, every pattern here is matched relative to the project's OWN
    # root instead — so an anchored pattern from an external file is
    # reinterpreted relative to this project's root, not that file's actual
    # location. Un-anchored patterns (the common case — e.g. `node_modules/`
    # with no leading slash) are unaffected and match correctly either way.
    #
    # Per-project override: projects[].indexer.extra_gitignore_paths — this
    # is ADDITIVE to the list below (merged, not replaced). Example:
    #   projects:
    #     - name: my-project
    #       indexer:
    #         extra_gitignore_paths: ["../.gitignore"]   # monorepo top-level
    extra_gitignore_paths: []

    # File extensions to index. Others are silently ignored.
    # Safelist approach — this is also what keeps binaries out (no separate
    # binary-detection step needed) and what `get_file` consults to decide
    # whether a path is servable at all. Grouped for readability only; the
    # indexer treats this as one flat list.
    include_extensions:
      # ── Code ──────────────────────────────────────────────────────────────
      - .kt
      - .kts
      - .ts
      - .tsx
      - .js
      - .jsx
      - .vue         # Vue Single File Components
      - .cs          # C# / .NET
      - .java        # Java
      - .cpp
      - .cc
      - .cxx
      - .c
      - .h
      - .hpp         # C / C++
      - .go          # Go
      - .rs          # Rust
      - .rb          # Ruby
      - .php         # PHP
      - .swift       # KMP / iOS targets
      - .py
      - .sh
      - Dockerfile
      # ── Config / structured data ─────────────────────────────────────────
      - .html
      - .css
      - .scss
      - .json
      - .yaml
      - .yml
      - .toml
      - .sql
      # ── Documentation (tree-indexed when doc_index thresholds are met) ───
      - .md

  # ── Documentation tree index (PageIndex-style) ──────────────────────────────
  doc_index:
    enabled: true
    # File extensions that trigger tree indexing (not Qdrant chunking)
    tree_extensions: [".md"]
    # Minimum number of headings before tree mode activates
    # Files below this threshold fall back to existing heading-boundary chunking in Qdrant
    min_headings_for_tree: 8
    # Maximum tokens per tree node summary (passed to LLM)
    max_tokens_per_node_summary: 300
    # LLM model to use for tree building and search reasoning
    # Defaults to the same model used for L1 summaries
    tree_llm_model: null   # null = inherit from shared.llm.model
    # Paths (relative to project root) that are always tree-indexed regardless of heading count
    always_tree_paths:
      - "docs/"
      - "wiki/"
      - "adr/"
      - "architecture/"
      - "RFC/"

  # ── Re-ranker ──────────────────────────────────────────────────────────────────
  # Token-level ColBERT re-ranking (MaxSim), part of the same shared, mandatory
  # "inference" service that generates embeddings (.ai-context/inference/,
  # FastEmbed/onnxruntime) — no longer a separate, optional container, and no
  # longer disable-able: re-ranking is now always attempted, falling back to
  # the keyword boost only on a transient failure (network error, service
  # briefly restarting), not via a config toggle. Backend (colbert vs.
  # cross-encoder) and model are fixed at Docker build time in
  # inference/Dockerfile (RERANKER_BACKEND/RERANKER_MODEL build ARGs) — not a
  # config.yaml field, since neither has a config-facing lever any more than
  # the embedding model does. See docs/architecture-deep-dive.md.
  reranker:
    top_n: 20   # candidates to re-rank — the only remaining runtime knob

  # ── Skill file generation ────────────────────────────────────────────────────
  # `init_ide.sh` always writes the canonical skill file to
  # .ai-context/skills/ai-context-workflow/SKILL.md — an
  # example/starter copy, in the folder-per-skill SKILL.md format that
  # skill-discovery agents expect, kept here purely for reference. It is NOT
  # read by any agent from this location; copy it (or set target_path below
  # to have init_ide.sh copy it for you) to wherever your tooling actually
  # scans for skills.
  #
  # `target_path` may be a single path or `target_paths` a list. A leading '~'
  # is expanded to $HOME; a relative path is resolved from the repo root.
  # Multiple entries let different agents find the same skill in their own
  # conventions (e.g. `.github/skills/` versus Crush's `.crush/skills/`).
  #
  # The skill name is the fixed repo-wide `ai-context-workflow`, so a path
  # like `.github/skills/` will write to `.github/skills/ai-context-workflow/SKILL.md`.
  skill:
    # Directory where init_ide.sh should copy the repo-wide skill.
    # The canonical skill is always written to
    #   <skill_save_dir>/skills/ai-context-workflow/SKILL.md
    # so every agent finds it in the same folder-per-skill layout.
    # A trailing slash is optional (`.github` and `.github/` are equivalent).
    # A leading '~' expands to $HOME; relative paths are resolved from the
    # repo root; {repo_root} is also supported.
    target_path: ".github"
    # target_paths:
    #   - "~/.config/crush/skills"
    #   - ".github"

  # ── IDE MCP config save paths ─────────────────────────────────────────────────
  # Where init_ide.sh writes the MCP server entries. The default writes both to
  # the repo-local VS Code config and to the IntelliJ GitHub Copilot global
  # config. Override or extend this list to match the agents you actually use.
  # Placeholders: {repo_root} is replaced by the repo root; a leading '~' is
  # expanded to $HOME. Relative paths are resolved from {repo_root}.
  #
  # mcp_config_paths:
  #   - "{repo_root}/.vscode/mcp.json"
  #   - "{repo_root}/.github/mcp.json"
  #   - "~/.config/github-copilot/intellij/mcp.json"

  # ── Backup output directory ───────────────────────────────────────────────────
  # Where per-project backup files are written on the host.
  # Relative to the repo root (the directory containing .ai-context/).
  # Default: .ai-context/database-backup
  #
  # Files written per project:
  #   qdrant.snapshot      — local fast-restore              (gitignored)
  #   qdrant.vectors.json  — git baseline for teammates      (commit this)
  #   postgres.json        — row export                      (commit this)
  #   backup_meta.json     — local display metadata          (gitignored)
  #
  # Run: mise run ai-context-backup
  # Commit qdrant.vectors.json + postgres.json to git to share a restore baseline.
  backup_output_dir: ".ai-context/database-backup"

  # Default format for: mise run ai-context-backup
  # Can always be overridden per-run with a flag (--snapshot / --json / --both).
  #
  #   "both"      — snapshot + json vectors (default)
  #                 After run: commit json files to git for teammates.
  #   "snapshot"  — snapshot only (fast, local restore, gitignored)
  #   "json"      — json vectors only (git baseline, no snapshot)
  #
  # Note: the shutdown backup (Ctrl-C on mise run ai-context-up) always uses
  # "snapshot" regardless of this setting — it must be fast.
  backup_format: "both"


# ── Projects ──────────────────────────────────────────────────────────────────
# Each entry is one independently indexed + served project.
# The `name` becomes the Qdrant collection, DB key, container suffix, and
# mcp.json server key — it must be unique, kebab-case, no spaces.
#
# mcp.port  must be set manually — pick a free port unique to this machine.
#
# profile:
#   - Auto-detected from the project's files (Gradle/Maven build files,
#     package.json framework deps, file-extension census) — NOT a config
#     field. Setting it here is a validation error; remove it if migrating
#     an older config.yaml. See scripts/validate_config.py:_detect_profile.
#
# root_path:
#   - Relative to the repo root (the directory that contains .ai-context/).
#   - Use "" to index the entire repo.
#   - Must not be absolute or contain "..".
#   - Tip for monorepos: set root_path to the sub-directory you work in most
#     to avoid diluting search results with unrelated modules.
#
# sources:
#   - List other projects whose context this project can pull in during queries.
#   - Depth is capped at 1: sources-of-sources are never followed.
#   - Fields:
#       project  (required)  name of the source project (must be registered)
#       scope    (optional)  sub-path within the source to restrict L1/L2 results
#       mode     (optional)  how much context to include from the source:
#                              l0         — project map only (~500 tokens)
#                              l0+l1      — map + file summaries  [default]
#                              l0+l1+l2   — map + summaries + raw code chunks
#       when     (optional)  comma-separated keywords; if any keyword appears in
#                            the query the source is always included, regardless
#                            of embedding similarity. Leave empty to rely on
#                            automatic similarity-based routing (threshold 0.55).
#
# lsp: (auto-detected, not manually configured — see
#      docs/lsp-integration.md)
#   - resolve_symbol's enabled languages are derived automatically from
#     this project's own files (same principle as the auto-detected
#     `profile` above) intersected with whichever languages are currently
#     installed in the LSP bridge's Docker image. There is no
#     `lsp.enabled_languages` field to set — validate_config.py rejects it
#     if present, to prevent it drifting from reality.
#   - idle_timeout_minutes: how long an idle language-server child process
#     stays alive before being evicted (default: 15) — this is the only
#     remaining per-project override, since it's a performance knob, not a
#     correctness choice.

projects:
  - name: "ai-context"
    display_name: "AI Context"
    root_path: ".ai-context"   # Index only the .ai-context directory for self-querying (e.g. backup restore)

    mcp:
      port: 7111
      max_context_tokens: 8000
