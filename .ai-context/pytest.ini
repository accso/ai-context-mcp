[pytest]
# Root pytest config for .ai-context's Python components (watcher, lsp-bridge,
# scripts, inference). Each component is an independent, flat-namespace Python codebase
# (no __init__.py, sibling modules imported by bare name, e.g. chunker.py's
# `import symbol_extractor`) — see each component's tests/conftest.py for the
# sys.path wiring this requires. Excluded from this repo's Python test scope:
# .ai-monitoring and .ai-benchmark (separate tools, moving to their own repos).
#
# Tiering is directory-based (mirrors mcp-server/test/{unit,integration,e2e}),
# so scripts/test.sh can select a tier by path, e.g.:
#   pytest watcher/tests/unit            (Tier 1 only, no Docker/network)
#   pytest watcher/tests/integration     (Tier 2, needs disposable Postgres/Qdrant)
#   pytest watcher/tests                 (both tiers for this component)
#   pytest                               (every component, every tier — see testpaths)
testpaths =
    watcher/tests
    lsp-bridge/tests
    scripts/tests
    inference/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Required because three independent components each have their own
# tests/unit/test_harness_smoke.py (and will have more identically-named
# files across components going forward) with no shared __init__.py chain
# (deliberate — these are flat-namespace codebases, not Python packages;
# see each component's tests/conftest.py). The default "prepend" import
# mode keys modules by basename alone and collides across components;
# importlib keys by full path instead, so identical basenames in different
# component directories never collide.
addopts = --import-mode=importlib
markers =
    unit: Tier 1 — pure functions, no Docker/network required.
    integration: Tier 2 — needs disposable Postgres/Qdrant (or mocks).
